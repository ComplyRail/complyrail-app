name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: complyrail-app
      - uses: actions/checkout@v4
        with:
          repository: ComplyRail/complyrail-sdk
          path: complyrail-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: complyrail-app/package-lock.json
      - run: cd complyrail-app && npm install --legacy-peer-deps
      - run: cd complyrail-sdk && npm ci && npm run build
      - run: cd complyrail-app && npm run type-check
      - run: cd complyrail-app && npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: complyrail-app
      - uses: actions/checkout@v4
        with:
          repository: ComplyRail/complyrail-sdk
          path: complyrail-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: complyrail-app/package-lock.json
      - run: cd complyrail-app && npm install --legacy-peer-deps
      - run: cd complyrail-sdk && npm ci && npm run build
      - run: cd complyrail-app && npm test -- --run

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: complyrail-app
      - uses: actions/checkout@v4
        with:
          repository: ComplyRail/complyrail-sdk
          path: complyrail-sdk
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: complyrail-app/package-lock.json
      - run: cd complyrail-app && npm install --legacy-peer-deps
      - run: cd complyrail-sdk && npm ci && npm run build
      - run: cd complyrail-app && npm run build
