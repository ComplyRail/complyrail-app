name: Contracts

on:
  push:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']
  pull_request:
    branches: [main]
    paths: ['contracts/**', '.github/workflows/contracts.yml']

defaults:
  run:
    working-directory: contracts/complyrail

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/complyrail
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - uses: stellar/stellar-cli@v30.0.1
      - name: Build WASM
        run: stellar contract build
      - uses: actions/upload-artifact@v4
        with:
          name: complyrail-wasm
          path: contracts/complyrail/target/wasm32v1-none/release/complyrail.wasm
